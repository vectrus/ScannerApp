name: Build Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build metadata
        id: meta
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $buildId = "build-$stamp-$shortSha"
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          $buildTime = Get-Date -AsUTC -Format o
          @(
            '"""Build metadata generated by GitHub Actions."""'
            ''
            "BUILD_ID = `"$buildId`""
            "BUILD_TIME = `"$buildTime`""
            "BUILD_COMMIT = `"${{ github.sha }}`""
          ) | Set-Content -Encoding UTF8 boekscanner/build_info.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Build app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm installer/BoekScanner.spec

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BoekScanner/* -DestinationPath BoekScanner-windows.zip -Force

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.build_id }}
          name: BoekScanner ${{ steps.meta.outputs.build_id }}
          body: |
            Automatische BoekScanner build vanaf `main`.

            Commit: `${{ github.sha }}`
          files: BoekScanner-windows.zip
          make_latest: true
