<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Segoe UI, Arial, sans-serif">
  <title>NAPS2 hoofdvenster</title>
  <desc>NAPS2 hoofdvenster met de grote groene Scan-knop omcirkeld.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#d4380d"/>
    </marker>
    <symbol id="cameraicon" viewBox="0 0 32 32">
      <rect x="3" y="9" width="26" height="18" rx="2" fill="#fff"/>
      <rect x="11" y="6" width="10" height="4" rx="1" fill="#fff"/>
      <circle cx="16" cy="18" r="6" fill="none" stroke="#1f7a4d" stroke-width="2"/>
      <circle cx="16" cy="18" r="2.5" fill="#1f7a4d"/>
    </symbol>
  </defs>

  <!-- Window shadow -->
  <rect x="20" y="20" width="720" height="440" rx="6" fill="#000" opacity="0.12"/>
  <!-- Window -->
  <rect x="16" y="16" width="720" height="440" rx="6" fill="#f3f3f3" stroke="#9aa0a6"/>

  <!-- Title bar -->
  <rect x="16" y="16" width="720" height="32" rx="6" fill="#1f7a4d"/>
  <rect x="16" y="40" width="720" height="8" fill="#1f7a4d"/>
  <text x="36" y="37" font-size="14" fill="#fff" font-weight="600">NAPS2 - Not Another PDF Scanner</text>
  <line x1="708" y1="26" x2="720" y2="38" stroke="#fff" stroke-width="2"/>
  <line x1="720" y1="26" x2="708" y2="38" stroke="#fff" stroke-width="2"/>

  <!-- Menu bar -->
  <rect x="16" y="48" width="720" height="26" fill="#fafafa" stroke="#d0d7de"/>
  <text x="32"  y="66" font-size="12" fill="#222">File</text>
  <text x="68"  y="66" font-size="12" fill="#222">Edit</text>
  <text x="106" y="66" font-size="12" fill="#222">View</text>
  <text x="148" y="66" font-size="12" fill="#222">Image</text>
  <text x="200" y="66" font-size="12" fill="#222" font-weight="700">Tools</text>
  <polygon points="240,60 248,60 244,66" fill="#222"/>
  <text x="262" y="66" font-size="12" fill="#222">Help</text>

  <!-- Toolbar with big Scan button -->
  <rect x="16" y="74" width="720" height="100" fill="#fff" stroke="#d0d7de"/>

  <!-- BIG GREEN SCAN BUTTON -->
  <rect x="32" y="86" width="180" height="76" rx="8" fill="#22a55a" stroke="#15803d" stroke-width="2"/>
  <use href="#cameraicon" x="56" y="106" width="44" height="36"/>
  <text x="158" y="118" font-size="22" text-anchor="middle" fill="#fff" font-weight="700">Scan</text>
  <text x="158" y="148" font-size="11" text-anchor="middle" fill="#fff" opacity="0.9">Klik om te scannen</text>

  <!-- Other toolbar buttons -->
  <g>
    <rect x="228" y="92" width="64" height="64" fill="#fff" stroke="#d0d7de"/>
    <rect x="244" y="106" width="32" height="40" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <line x1="250" y1="118" x2="270" y2="118" stroke="#666"/>
    <line x1="250" y1="124" x2="270" y2="124" stroke="#666"/>
    <line x1="250" y1="130" x2="266" y2="130" stroke="#666"/>
    <text x="260" y="148" text-anchor="middle" font-size="10">Profiles</text>

    <rect x="300" y="92" width="64" height="64" fill="#fff" stroke="#d0d7de"/>
    <path d="M 320,140 L 320,118 L 312,118 L 326,104 L 340,118 L 332,118 L 332,140 Z" fill="#666"/>
    <text x="332" y="148" text-anchor="middle" font-size="10">Import</text>

    <rect x="372" y="92" width="64" height="64" fill="#fff" stroke="#d0d7de"/>
    <rect x="392" y="106" width="24" height="28" fill="#666"/>
    <rect x="396" y="106" width="16" height="8" fill="#fff"/>
    <rect x="396" y="124" width="16" height="6" fill="#fff"/>
    <text x="404" y="148" text-anchor="middle" font-size="10">Save PDF</text>

    <rect x="444" y="92" width="64" height="64" fill="#fff" stroke="#d0d7de"/>
    <rect x="464" y="116" width="24" height="14" fill="#666"/>
    <rect x="468" y="106" width="16" height="10" fill="#fff" stroke="#666"/>
    <rect x="468" y="130" width="16" height="6" fill="#fff" stroke="#666"/>
    <text x="476" y="148" text-anchor="middle" font-size="10">Print</text>

    <rect x="516" y="92" width="64" height="64" fill="#fff" stroke="#d0d7de"/>
    <path d="M 536,118 a 12,12 0 1 1 0,12" fill="none" stroke="#666" stroke-width="2"/>
    <polygon points="536,134 542,128 530,128" fill="#666"/>
    <text x="548" y="148" text-anchor="middle" font-size="10">Rotate</text>
  </g>

  <!-- Thumbnail area placeholder -->
  <rect x="16" y="174" width="720" height="226" fill="#fff" stroke="#d0d7de"/>
  <text x="376" y="290" text-anchor="middle" font-size="14" fill="#999">
    Hier verschijnen de gescande pagina's als kleine voorbeeldjes.
  </text>
  <text x="376" y="312" text-anchor="middle" font-size="12" fill="#bbb">
    (Met "Auto Save" aan worden ze ook in de Scan inbox van BoekScanner opgeslagen.)
  </text>

  <!-- Status bar -->
  <rect x="16" y="400" width="720" height="56" fill="#f3f3f3" stroke="#d0d7de"/>
  <text x="32" y="424" font-size="12" fill="#666">0 pagina's | Profiel: Canon TS5150</text>

  <!-- Annotation arrow + label -->
  <path d="M 122 220 L 122 175" stroke="#d4380d" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="20" y="220" width="220" height="50" rx="6" fill="#d4380d"/>
  <text x="130" y="244" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Druk op deze grote</text>
  <text x="130" y="262" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">groene knop om te scannen</text>
</svg>
