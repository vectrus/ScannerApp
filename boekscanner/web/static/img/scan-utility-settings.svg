<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Segoe UI, Arial, sans-serif">
  <title>IJ Scan Utility - Settings dialog</title>
  <desc>Settings-venster van IJ Scan Utility met de Save in optie gemarkeerd.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#d4380d"/>
    </marker>
    <symbol id="dropdownarrow" viewBox="0 0 12 12">
      <polygon points="2,4 10,4 6,9" fill="#444"/>
    </symbol>
    <symbol id="foldericon" viewBox="0 0 16 16">
      <path d="M 1,3 L 6,3 L 8,5 L 15,5 L 15,13 L 1,13 Z" fill="#fbbf24" stroke="#92400e" stroke-width="0.6"/>
    </symbol>
  </defs>

  <!-- Window shadow -->
  <rect x="20" y="20" width="720" height="500" rx="6" fill="#000" opacity="0.12"/>
  <!-- Window -->
  <rect x="16" y="16" width="720" height="500" rx="6" fill="#f3f3f3" stroke="#9aa0a6"/>

  <!-- Title bar -->
  <rect x="16" y="16" width="720" height="32" rx="6" fill="#0078d4"/>
  <rect x="16" y="40" width="720" height="8" fill="#0078d4"/>
  <text x="36" y="37" font-size="14" fill="#fff" font-weight="600">Settings (Document Scan)</text>
  <line x1="708" y1="26" x2="720" y2="38" stroke="#fff" stroke-width="2"/>
  <line x1="720" y1="26" x2="708" y2="38" stroke="#fff" stroke-width="2"/>

  <!-- Left sidebar -->
  <rect x="16" y="48" width="200" height="468" fill="#e8e8e8" stroke="#d0d7de"/>

  <rect x="16" y="60" width="200" height="30" fill="#e8e8e8"/>
  <use href="#foldericon" x="24" y="68" width="14" height="14"/>
  <text x="44" y="80" font-size="12" fill="#222">Auto Scan</text>

  <!-- Selected: Document Scan -->
  <rect x="16" y="92" width="200" height="30" fill="#0078d4"/>
  <text x="24" y="112" font-size="12" fill="#fff" font-weight="700">Document Scan</text>

  <rect x="16" y="124" width="200" height="30" fill="#e8e8e8"/>
  <text x="24" y="144" font-size="12" fill="#222">Photo Scan</text>

  <rect x="16" y="156" width="200" height="30" fill="#e8e8e8"/>
  <text x="24" y="176" font-size="12" fill="#222">Custom Scan</text>

  <rect x="16" y="188" width="200" height="30" fill="#e8e8e8"/>
  <text x="24" y="208" font-size="12" fill="#222">ScanGear</text>

  <rect x="16" y="220" width="200" height="30" fill="#e8e8e8"/>
  <text x="24" y="240" font-size="12" fill="#222">Save Settings</text>

  <!-- Right pane -->
  <text x="234" y="78" font-size="14" font-weight="700" fill="#222">Scan Options</text>

  <text x="234" y="110" font-size="13" fill="#222">Select Source:</text>
  <rect x="380" y="96" width="320" height="22" fill="#fff" stroke="#a8a8a8"/>
  <text x="392" y="112" font-size="12">Document</text>
  <use href="#dropdownarrow" x="678" y="100" width="16" height="16"/>

  <text x="234" y="142" font-size="13" fill="#222">Color Mode:</text>
  <rect x="380" y="128" width="320" height="22" fill="#fff" stroke="#a8a8a8"/>
  <text x="392" y="144" font-size="12">Color</text>
  <use href="#dropdownarrow" x="678" y="132" width="16" height="16"/>

  <text x="234" y="174" font-size="13" fill="#222">Resolution:</text>
  <rect x="380" y="160" width="320" height="22" fill="#fff" stroke="#a8a8a8"/>
  <text x="392" y="176" font-size="12" font-weight="700">300 dpi</text>
  <use href="#dropdownarrow" x="678" y="164" width="16" height="16"/>

  <text x="234" y="220" font-size="14" font-weight="700" fill="#222">Save Settings</text>

  <text x="234" y="250" font-size="13" fill="#222">File Name:</text>
  <rect x="380" y="236" width="320" height="22" fill="#fff" stroke="#a8a8a8"/>
  <text x="392" y="252" font-size="12">IMG</text>

  <text x="234" y="282" font-size="13" fill="#222">Data Format:</text>
  <rect x="380" y="268" width="320" height="22" fill="#fff" stroke="#a8a8a8"/>
  <text x="392" y="284" font-size="12" font-weight="700">PNG</text>
  <use href="#dropdownarrow" x="678" y="272" width="16" height="16"/>

  <!-- Save in - HIGHLIGHTED -->
  <rect x="226" y="304" width="494" height="46" rx="6" fill="#fffbe6" stroke="#d4380d" stroke-width="3"/>
  <text x="234" y="328" font-size="13" font-weight="700" fill="#d4380d">Save in:</text>
  <rect x="380" y="316" width="278" height="24" fill="#fff" stroke="#d4380d" stroke-width="2"/>
  <text x="392" y="333" font-size="11" fill="#222">C:\BoekScanner\data\inbox</text>
  <rect x="664" y="316" width="48" height="24" fill="#f3f3f3" stroke="#d4380d" stroke-width="2"/>
  <text x="688" y="333" font-size="14" text-anchor="middle" font-weight="700">...</text>

  <text x="234" y="380" font-size="12" fill="#666">Wanneer u hier het pad van de Scan inbox kiest,</text>
  <text x="234" y="396" font-size="12" fill="#666">verschijnt elke nieuwe scan automatisch in BoekScanner.</text>

  <!-- OK / Cancel buttons -->
  <rect x="490" y="468" width="100" height="30" fill="#0078d4" stroke="#0078d4"/>
  <text x="540" y="488" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">OK</text>
  <rect x="600" y="468" width="100" height="30" fill="#fff" stroke="#a8a8a8"/>
  <text x="650" y="488" font-size="13" fill="#222" text-anchor="middle">Cancel</text>

  <!-- Annotation arrow + label -->
  <path d="M 130 460 Q 250 460 290 350" stroke="#d4380d" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="20" y="440" width="220" height="40" rx="6" fill="#d4380d"/>
  <text x="130" y="465" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Kies hier de Scan inbox-map</text>
  <text x="130" y="478" text-anchor="middle" fill="#fff" font-size="11">van BoekScanner</text>
</svg>
