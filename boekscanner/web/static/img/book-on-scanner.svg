<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Segoe UI, Arial, sans-serif">
  <title>Pagina goed op de scanner leggen</title>
  <desc>Bovenaanzicht van de scannerglasplaat met daarop een pagina, juist gepositioneerd in de hoek met het pijltje.</desc>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#d4380d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="460" fill="#f9fafb"/>

  <!-- Scanner outer body -->
  <rect x="60" y="60" width="640" height="360" rx="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>

  <!-- Scanner lid hinge (back) -->
  <rect x="60" y="60" width="640" height="22" fill="#1f2937"/>
  <text x="380" y="76" text-anchor="middle" font-size="11" fill="#9ca3af">scharnier (achterkant van de printer)</text>

  <!-- Glass plate -->
  <rect x="100" y="100" width="560" height="300" fill="#e5f3ff" stroke="#0078d4" stroke-width="2"/>
  <text x="120" y="125" font-size="11" fill="#0078d4" opacity="0.7">scannerglas</text>

  <!-- Corner indicator (top-left) - the alignment arrow -->
  <rect x="100" y="100" width="40" height="40" fill="#fbbf24" opacity="0.4"/>
  <!-- arrow pointing inward (down-right) drawn with a line + arrowhead -->
  <line x1="108" y1="108" x2="132" y2="132" stroke="#d4380d" stroke-width="3" marker-end="url(#ah)"/>
  <circle cx="100" cy="100" r="14" fill="none" stroke="#d4380d" stroke-width="3"/>

  <!-- Page (placed in the corner) - showing back side because it's face-down -->
  <g transform="translate(106, 106)">
    <!-- Underside of page (the side facing the glass) -->
    <rect x="0" y="0" width="280" height="288" fill="#fffef9" stroke="#9ca3af"/>
    <!-- Spine indicator -->
    <rect x="0" y="0" width="6" height="288" fill="#d1d5db"/>

    <!-- Mirrored text suggestion (using horizontal flip) -->
    <g opacity="0.18" font-size="11" fill="#374151" transform="translate(140, 144) scale(-1, 1)">
      <text x="0" y="-100" text-anchor="middle">Hoofdstuk 1</text>
      <text x="0" y="-70" text-anchor="middle">==================</text>
      <text x="0" y="-40" text-anchor="middle">Lorem ipsum dolor sit amet,</text>
      <text x="0" y="-22" text-anchor="middle">consectetur adipiscing elit.</text>
      <text x="0" y="-4"  text-anchor="middle">Sed do eiusmod tempor</text>
      <text x="0" y="14"  text-anchor="middle">incididunt ut labore.</text>
      <text x="0" y="42"  text-anchor="middle">Ut enim ad minim veniam,</text>
      <text x="0" y="60"  text-anchor="middle">quis nostrud exercitation.</text>
      <text x="0" y="78"  text-anchor="middle">Duis aute irure dolor in</text>
      <text x="0" y="96"  text-anchor="middle">reprehenderit in voluptate.</text>
    </g>
    <text x="140" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af">achterkant van de pagina</text>
    <text x="140" y="180" text-anchor="middle" font-size="11" fill="#9ca3af">(de tekst kijkt naar het glas)</text>
  </g>

  <!-- Caption box -->
  <rect x="420" y="140" width="240" height="180" rx="10" fill="#fff" stroke="#d4380d" stroke-width="2"/>
  <text x="540" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#d4380d">Zo leggen!</text>
  <line x1="440" y1="180" x2="640" y2="180" stroke="#d4380d" stroke-width="1"/>

  <text x="440" y="206" font-size="13" fill="#222">Tekst <tspan font-weight="700">naar beneden</tspan></text>
  <text x="440" y="232" font-size="13" fill="#222">In de hoek met het</text>
  <text x="440" y="250" font-size="13" fill="#222"><tspan font-weight="700" fill="#d4380d">pijltje</tspan> (linksboven)</text>
  <text x="440" y="276" font-size="13" fill="#222">Recht uitlijnen langs</text>
  <text x="440" y="294" font-size="13" fill="#222">de randen van het glas</text>

  <!-- Arrow from text box to corner -->
  <path d="M 420 230 Q 280 230 140 130" stroke="#d4380d" stroke-width="2.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/>
</svg>
